<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lhaj Moha | Official Creator Hub & Portal</title>
  
  <link rel="icon" href="avatar.png" type="image/png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: { 
              bg: '#080a12', 
              card: '#101424', 
              border: '#1e293b',
              blue: '#00f0ff',
              red: '#ff0055'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #080a12;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.12), transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255, 0, 85, 0.12), transparent 40%),
        linear-gradient(to bottom, #080a12, #0d1120);
      background-attachment: fixed;
      color: #f0f4f8;
    }
    
    .gradient-text-multi {
      background: linear-gradient(135deg, #00f0ff 0%, #ff0055 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .banner-wrapper {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
      background-color: #080a12;
    }

    @media (min-width: 768px) {
      .banner-wrapper {
        height: 280px;
      }
    }

    .banner-bg-blur {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(15px) brightness(0.6);
      transform: scale(1.1);
    }

    .banner-main-img {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .avatar-exact {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
