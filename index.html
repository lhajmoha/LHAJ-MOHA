<!-- ================= RADIO MAROC SECTION ================= -->
<h2 class="text-xl font-bold mb-4 flex items-center gap-2 border-b border-slate-800 pb-2 gradient-text-multi mt-8">
  <i class="fas fa-radio text-cyan-400"></i> إذاعات الراديو المغربية المباشرة
</h2>

<div class="bg-cyber-card/90 border border-slate-800 rounded-xl p-4 backdrop-blur-md mb-8">
  <!-- Search & Filters -->
  <div class="flex flex-col sm:flex-row gap-3 mb-4 justify-between items-center">
    <div class="relative w-full sm:w-64">
      <i class="fas fa-search absolute left-3 top-3 text-gray-400 text-xs"></i>
      <input type="text" id="radioSearch" placeholder="بحث عن إذاعة..." oninput="filterRadios()" class="w-full bg-black/50 border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-400">
    </div>
    <div class="flex gap-1 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
      <button onclick="filterCategory('all')" class="cat-btn active bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 text-xs px-3 py-1 rounded-lg">الكل</button>
      <button onclick="filterCategory('music')" class="cat-btn bg-black/40 text-gray-400 border border-slate-800 text-xs px-3 py-1 rounded-lg hover:text-white">موسيقى</button>
      <button onclick="filterCategory('news')" class="cat-btn bg-black/40 text-gray-400 border border-slate-800 text-xs px-3 py-1 rounded-lg hover:text-white">أخبار</button>
      <button onclick="filterCategory('sports')" class="cat-btn bg-black/40 text-gray-400 border border-slate-800 text-xs px-3 py-1 rounded-lg hover:text-white">رياضة</button>
    </div>
  </div>

  <!-- Radios Grid -->
  <div id="radioGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 max-h-72 overflow-y-auto pr-1">
    <!-- Radio stations will be generated dynamically -->
  </div>
</div>

<!-- Sticky Bottom Player Bar -->
<div id="stickyPlayer" class="fixed bottom-0 left-0 w-full bg-slate-950/95 border-t border-cyan-500/30 p-3 z-50 backdrop-blur-md hidden shadow-2xl">
  <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div id="playerIcon" class="w-10 h-10 rounded-lg bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 font-bold text-sm">
        <i class="fas fa-broadcast-tower"></i>
      </div>
      <div>
        <div id="playerStation" class="font-bold text-white text-sm">إذاعة لم يتم تحديدها</div>
        <div id="playerGenre" class="text-xs text-cyan-400 flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> بث مباشر
        </div>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <button id="mainPlayBtn" onclick="togglePlay()" class="w-10 h-10 rounded-full bg-gradient-to-r from-cyan-500 to-rose-500 text-white flex items-center justify-center text-sm shadow-lg shadow-cyan-500/30">
        <i id="mainPlayIcon" class="fas fa-play"></i>
      </button>
      <div class="hidden md:flex items-center gap-2">
        <i class="fas fa-volume-up text-xs text-gray-400"></i>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" oninput="setVolume(this.value)" class="w-20 accent-cyan-400 h-1">
      </div>
    </div>
  </div>
</div>

<audio id="globalAudioPlayer" class="hidden"></audio>
<!-- ================= END RADIO MAROC SECTION ================= -->
